<!DOCTYPE html>

<head>

    <header>

    <!-- Pestañas de categoría (una por cada hoja del Google Sheet) -->
    <nav id="catalogo-tabs" class="catalogo-tabs" aria-label="Categorías de productos"></nav>

    <div class="productos__grid">
      <p class="catalogo-cargando">Cargando productos...</p>
    </div>

  </section>

  <script src="Javascript/catalogo.js" defer></script>
